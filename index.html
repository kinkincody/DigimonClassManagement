<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Suspended</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .subtle-grid {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        .pulse-soft {
            box-shadow: 0 0 45px -10px rgba(239, 68, 68, 0.25);
        }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans min-h-screen flex flex-col justify-between items-center p-6 selection:bg-rose-500/20 selection:text-rose-300 relative overflow-hidden">
    <div class="fixed inset-0 subtle-grid pointer-events-none"></div>
    <div class="fixed -top-40 left-1/2 -translate-x-1/2 w-96 h-96 bg-rose-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Header status badge -->
    <header class="w-full max-w-xl flex justify-between items-center py-4 z-10">
        <div class="flex items-center space-x-2">
            <span class="relative flex h-2.5 w-2.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500"></span>
            </span>
            <span class="text-xs uppercase tracking-widest text-neutral-400 font-mono font-medium">Status : Terminated</span>
        </div>
        <span class="text-xs text-neutral-500 font-mono">ERR_DATA_CORRUPTION</span>
    </header>

    <main class="w-full max-w-2xl my-auto z-10 flex flex-col items-center text-center">
        <!-- Warning Icon -->
        <div class="mb-8 p-4 rounded-2xl bg-neutral-900/80 border border-neutral-800 text-rose-400 pulse-soft">
            <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
        </div>

        <!-- The Requested Single Sentence -->
        <h1 class="text-2xl sm:text-3xl md:text-4xl font-semibold tracking-tight text-neutral-100 leading-snug sm:leading-snug md:leading-relaxed max-w-xl">
            Due to unauthorized tampering and improper modification of data by a classmate, this website and its database have been corrupted, and operations are permanently suspended.
        </h1>

        <!-- Subtle technical badge -->
        <div class="mt-8 flex items-center gap-2 px-3 py-1.5 rounded-full bg-neutral-900 border border-neutral-800 text-neutral-400 text-xs font-mono">
            <svg class="w-3.5 h-3.5 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <span>Access has been restricted</span>
        </div>
    </main>

    <footer class="w-full max-w-xl text-center py-4 z-10">
        <p class="text-xs text-neutral-600 font-mono">System Offline &bull; No active recovery in progress</p>
    </footer>
</body>
</html>
