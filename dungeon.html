  <script>
    window.__DUNGEON_GATE = null;
    (function () {
      try {
        var raw = sessionStorage.getItem('DIGIMON_CLASS_GATE_V1');
        var gate = raw ? JSON.parse(raw) : null;
        var fresh = gate && gate.role === 'student' && gate.id && gate.issuedAt && (Date.now() - Number(gate.issuedAt)) < 18 * 60 * 60 * 1000;
        if (!fresh) {
          location.replace('index.html');
          return;
        }
        window.__DUNGEON_GATE = gate;
      } catch (err) {
        location.replace('index.html');
      }
    })();
  </script>

    function combatAct(room, action) {

      if (!foe || foe.hp <= 0) return null;
      const floats = [];
      const kind = action.kind || 'skill';
      if (kind === 'smoke') {
        if (!actor.bag || actor.bag.smoke < 1) return null;

        actor.acted = true;

      if (kind === 'shield') {

      } else if (kind === 'revive' || kind === 'sacrifice') {

          const hit = strikeFoe(room, actor, foe, power);
          floats.push({ text: hit.dealt ? ('-' + hit.dealt + (hit.tag ? ' ' + hit.tag : '')) : '免疫 / Immune', who: 'foe' });
          pushFeed(room, actor.name + ' ' + skill.name + ' · MP -' + cost);
        }

      if (foe.hp <= 0) {
        commitFloats(room, floats);

      }
      if (!turnActorId(room) && room.status === 'combat') enemyTurn(room, floats);

    function strikeFoe(room, actor, foe, power) {

      foe.hp = Math.max(0, foe.hp - hit.dealt);
      return hit;

    function transact(path, updater) {

        const rows = SHOP.map(item => '<button data-act="buy" data-item="' + item.id + '" ' + (bits < item.price ? 'disabled' : '') + ' class="tap rounded-2xl bg-slate-950 border border-amber-600 text-left px-3"><span class="font-black">' + esc(item.name) + '</span><span class="block text-xs text-amber-200">' + item.price + ' 數碼碎晶 / Bits · 我的 / mine ' + bits + '</span></button>').join('');
        const bag = me && me.bag ? '煙霧 / Smoke ' + me.bag.smoke + ' · 復活 / Revive ' + me.bag.revive + ' · 護盾 / Shield ' + me.bag.shield + ' · 肉 / Meat ' + me.bag.meat : '';
        const leave = isHost(room) ? '<button id="btnLeaveNode" data-act="leave-node" class="tap w-full rounded-2xl bg-slate-800 font-black">離開商店 / Leave shop</button>' : '<p class="text-sm text-slate-400">用自己的碎晶購買。隊長離開時全隊前進。 / Buy with your own Bits. The host leads the squad on.</p>';
        return '<section class="panel space-y-3">' + roomPicture(event.art || ROOM_ART.merchant, '數碼商店 / Digital Shop') + who + '<h2 class="font-black text-amber-300 text-center">數碼商店 / Digital Shop</h2><p class="text-xs text-slate-300">每人用自己的數碼碎晶，買到自己的背包。離開迷宮後碎晶和道具會清零。 / Each tamer spends their own Digital Bits and keeps their own items. Bits and items reset when the dungeon ends.</p><p class="text-xs font-mono text-amber-100">' + bag + '</p><div class="grid grid-cols-1 gap-2">' + rows + '</div>' + leave + '</section>';
      }
      if (event.kind === 'baby') {
        const controls = isHost(room)
          ? '<div class="grid grid-cols-1 gap-2"><button id="btnFeedMeat" data-act="baby-feed" class="tap rounded-2xl bg-pink-700 font-black">用背包的肉餵食 / Feed bag meat</button><button data-act="baby-buy" class="tap rounded-2xl bg-amber-700 font-black">花 8 碎晶買肉並餵食 / Buy meat for 8 Bits</button><button id="btnIgnoreBaby" data-act="baby-ignore" class="tap rounded-2xl bg-slate-800 font-black">忽略 / Ignore</button></div>'
          : '<p class="text-sm text-slate-400">等待隊長決定。 / Waiting for the host.</p>';
        return '<section class="panel space-y-3">' + art + who + '<h2 class="font-black text-center">受傷的幼年數碼獸 / Wounded Baby</h2><p class="text-sm text-slate-300">餵肉可以讓牠協助這一局的戰鬥。忽略就離開。買肉只用隊長自己的數碼碎晶。 / Feed meat and it helps for this run. Ignore it to leave. Buying meat spends the host\'s own Digital Bits.</p>' + controls + '</section>';
      }
      if (event.kind === 'shortcut') {
        const follow = isHost(room) ? '<button id="btnLeaveNode" data-act="leave-node" class="tap w-full rounded-2xl bg-cyan-700 font-black">跟著走 / Follow</button>' : '<p class="text-sm text-slate-400">等待隊長。 / Waiting for the host.</p>';
        return '<section class="panel space-y-3">' + art + who + '<h2 class="font-black text-cyan-200 text-center">隱藏捷徑 / Hidden Shortcut</h2><p class="text-sm text-slate-300">這條路沒有陷阱。每位存活隊員回復 10% HP、6 MP，並各自找到數碼碎晶。 / This path has no traps. Each living tamer restores 10% HP and 6 MP, and finds their own Digital Bits.</p>' + follow + '</section>';
      }
      if (event.kind === 'supply') {
        const names = { smoke: '煙霧彈 / Smoke Bomb', shield: '護盾電池 / Shield Battery', meat: '肉塊 / Meat', revive: '復活晶片 / Revive Chip' };
        return '<section class="panel space-y-3">' + art + '<h2 class="font-black text-emerald-200 text-center">謎題補給 / Mystery Supply</h2><p class="text-sm text-slate-300">每位隊員獲得 ' + esc(names[event.item] || event.item) + '。這個道具只在這一局有效。 / Every member receives ' + esc(names[event.item] || event.item) + '. It lasts for this run only.</p>' + (isHost(room) ? '<button id="btnLeaveNode" data-act="leave-node" class="tap w-full rounded-2xl bg-emerald-600 font-black">收下 / Take it</button>' : '<p class="text-sm text-slate-400">等待隊長 / Waiting for the host.</p>') + '</section>';
      }
      if (event.kind === 'cache') {
        return '<section class="panel space-y-3">' + art + '<h2 class="font-black text-amber-200 text-center">碎晶儲藏 / Bit Cache</h2><p class="text-sm text-slate-300">每位存活隊員獲得數碼碎晶 +' + (event.bits || 0) + '。這些碎晶只在這一局有效。 / Each living tamer receives Digital Bits +' + (event.bits || 0) + '. They exist only inside this run.</p>' + (isHost(room) ? '<button id="btnLeaveNode" data-act="leave-node" class="tap w-full rounded-2xl bg-amber-500 text-slate-950 font-black">繼續 / Continue</button>' : '<p class="text-sm text-slate-400">等待隊長 / Waiting for the host.</p>') + '</section>';
      }
      return '<section class="panel space-y-3">' + art + who + '<h2 class="font-black text-center">光芒碎片 / Light Shard</h2><p class="text-sm">Salamon 交出光芒。光芒 +20。通關獎勵仍然是固定的 1000 EXP、1000 課堂金幣、5 張扭蛋券。 / Salamon shares Light +20. The clear reward stays 1000 EXP, 1000 classroom coins, and 5 gacha tickets.</p>' + (isHost(room) ? '<button id="btnVaultOk" data-act="leave-node" class="tap w-full rounded-2xl bg-amber-500 text-slate-950 font-black">收下 / Continue</button>' : '<p class="text-sm text-slate-400">等待隊長 / Waiting for the host.</p>') + '</section>';
    }
    function renderSettlement(room) {
      const result = room.result || {};
      if (result.kind === 'victory') {
        return '<section id="victoryModal" class="sheet-wrap fixed inset-0 z-40 bg-slate-950/80 flex items-end sm:items-center justify-center p-3"><div class="sheet panel space-y-3">' + roomPicture(ROOM_ART.boss, '首領傳送門 / Cyber Boss Portal') + '<h2 class="text-2xl font-black text-amber-200">第二十層清除 / Floor 20 clear</h2><p class="text-sm text-slate-200">' + esc(result.bossName || 'Mega') + ' 倒下了。每位參加者都獲得這份課堂獎勵。這一局的數碼碎晶、等級和道具已經清零。 / ' + esc(result.bossName || 'Mega') + ' has fallen. Every participant receives this classroom reward. Digital Bits, run levels, and items are now zero.</p><ul class="text-sm font-mono space-y-1"><li>EXP +' + result.exp + '</li><li>課堂金幣 / Classroom coins +' + result.coins + '</li><li>扭蛋券 / Gacha tickets +' + result.tickets + '</li></ul><a href="index.html" class="tap flex items-center justify-center rounded-2xl bg-cyan-600 font-black">返回課堂 / Return</a></div></section>';
      }
      return '<section id="defeatModal" class="sheet-wrap fixed inset-0 z-40 bg-slate-950/80 flex items-end sm:items-center justify-center p-3"><div class="sheet panel space-y-3"><h2 class="text-2xl font-black text-rose-200">全員倒下 / Squad down</h2><p class="text-sm">到達樓層 / Reached floor ' + result.floor + '/' + RUN_FLOORS + '。' + esc(result.killer || 'Digital Matrix') + ' 讓全隊的數碼獸倒下。數碼碎晶已清零。回到課堂後要用復活問答才能起來。 / That Digimon fainted the whole squad. Digital Bits are cleared. Back in class, the revive quiz is the way back up.</p><a href="index.html" class="tap flex items-center justify-center rounded-2xl bg-slate-700 font-black">離開 / Exit</a></div></section>';
    }
    function render() {
      if (!gate) return;
      paintHeader();
      const app = document.getElementById('app');
      if (!meStudent) {
        app.innerHTML = '<p class="text-sm text-slate-400">正在讀取馴獸師資料… / Loading tamer record…</p>';
        return;
      }
      let html = '';
      const room = currentRoom;
      if (!room || !myMember(room)) html = renderLobby();
      else if (room.status === 'lobby') html = renderLobby();
      else if (room.status === 'map') html = renderMap(room);
      else if (room.status === 'combat') html = renderCombat(room);
      else if (room.status === 'riddle') html = renderRiddle(room) + renderMap(Object.assign({}, room, { nodes: [] }));
      else if (room.status === 'event') html = renderEvent(room);
      else html = partyStrip(room);
      if (room && room.status === 'victory') html += renderSettlement(room);
      if (room && room.status === 'defeat') html = '<section class="panel space-y-2"><h2 class="font-black text-rose-200">返回課堂 / Returning to class</h2><p class="text-sm">全員倒下。接下來打開課堂的死亡畫面，不會登出。 / The squad is down. The classroom death screen opens next, and you stay signed in.</p></section>';
      const typing = document.activeElement && document.activeElement.id === 'joinCode';
      const draft = typing ? document.activeElement.value : joinDraft;
      app.innerHTML = html;
      const input = document.getElementById('joinCode');
      if (input) {
        input.value = draft;
        joinDraft = draft;
        if (typing) input.focus();
      }
      spawnFloats(room);
      if (window.__DIGI_TEST_DB) window.currentRoom = currentRoom;
      if (room && room.status === 'victory' && !celebrated) {
        celebrated = true;
        if (typeof confetti === 'function') confetti({ particleCount: 180, spread: 110, origin: { y: 0.55 } });
      }
    }
    function spawnFloats(room) {
      if (!room || (room.floatSeq || 0) === seenFloat) return;
      seenFloat = room.floatSeq || 0;
      const layer = document.getElementById('floatLayer');
      (room.lastFloats || []).forEach((float, index) => {
        const chip = document.createElement('div');
        chip.className = 'float-dmg';
        chip.textContent = float.text;
        chip.style.left = (18 + (index % 4) * 18) + '%';
        chip.style.top = (28 + Math.floor(index / 4) * 8) + '%';
        layer.appendChild(chip);
        setTimeout(() => chip.remove(), 900);
      });
    }

    async function onAppClick(event) {
      const button = event.target.closest('[data-act]');
      if (!button || button.disabled) return;
      const act = button.dataset.act;
      if (act === 'solo') return startSolo();
      if (act === 'create') return createLobby();
      if (act === 'join') return joinByCode();
      if (act === 'start') return startSquad();
      if (act === 'leave') return leaveLobby();
      if (act === 'node') {
        if (!isHost(currentRoom)) return;
        pendingNode = button.dataset.id;
        render();
        return;
      }
      if (act === 'cancel') {
        pendingNode = '';
        render();
        return;
      }
      if (act === 'confirm') {
        if (!isHost(currentRoom)) return;
        const nodeId = pendingNode;
        pendingNode = '';
        await commit({ type: 'choose', nodeId: nodeId, memberId: gate.id, now: offsetReady ? syncedNow() : 0, bank: questionBank() });
        return;
      }
      if (act === 'choice') return commit({ type: 'answer', memberId: gate.id, choice: button.dataset.choice });
      if (act === 'oasis-heal') return commit({ type: 'oasis', memberId: gate.id, choice: 'heal' });
      if (act === 'oasis-focus') return commit({ type: 'oasis', memberId: gate.id, choice: 'focus' });
      if (act === 'leave-node') return commit({ type: 'leaveNode', memberId: gate.id });
      if (act === 'buy') return buyItem(button.dataset.item);
      if (act === 'baby-feed') return feedOrBuy(false);
      if (act === 'baby-buy') return feedOrBuy(true);
      if (act === 'baby-ignore') return commit({ type: 'baby', memberId: gate.id, feed: false });
      if (act === 'body') {
        selectedBody = button.dataset.body;
        render();
        return;
      }
      if (act === 'basic') {
        return commit({ type: 'act', memberId: gate.id, kind: 'basic', targetId: selectedBody });
      }
      if (act === 'skill') {
        return commit({ type: 'act', memberId: gate.id, kind: 'skill', skill: Number(button.dataset.skill) || 0, targetId: selectedBody });
      }
      if (act === 'item-smoke') return commit({ type: 'act', memberId: gate.id, kind: 'smoke' });
      if (act === 'item-shield') return commit({ type: 'act', memberId: gate.id, kind: 'shield' });
      if (act === 'revive') return commit({ type: 'act', memberId: gate.id, kind: 'revive', allyId: button.dataset.ally });
      if (act === 'sacrifice') return commit({ type: 'act', memberId: gate.id, kind: 'sacrifice', allyId: button.dataset.ally });
    }

    function boot() {
      if (!gate) return;
      document.getElementById('app').addEventListener('click', onAppClick);
      document.getElementById('app').addEventListener('input', event => {
        if (event.target.id === 'joinCode') joinDraft = event.target.value;
      });
      db = window.__DIGI_TEST_DB || null;
      if (!db) {
        if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.database().ref();
      }
      db.child('.info/serverTimeOffset').on('value', snap => {
        if (!snap.exists()) return;
        offset = Number(snap.val()) || 0;
        offsetReady = true;
      });
      db.child('students/' + String(gate.id).toLowerCase()).on('value', snap => {
        meStudent = snap.val();
        if (meStudent) meStudent.id = String(gate.id).toLowerCase();
        if (currentRoom && currentRoom.status === 'defeat' && !sawLiveRun && currentRoom.result && currentRoom.result.granted && !studentIsDown()) {
          clearDungeonRoom();
          render();
          return;
        }
        render();
      });
      const classKey = sanitizeClassKey(firstClass(gate.classId));
      db.child('systemSettings/dungeonQuestions/' + classKey).on('value', snap => {
        const raw = snap.val();
        const rows = !raw ? [] : (Array.isArray(raw) ? raw : Object.keys(raw).sort().map(key => raw[key]));
        shrineBank = rows.filter(row => row && row.question && row.correct).map(row => ({
          question: String(row.question),
          correct: String(row.correct),
          wrongs: normalizeWrongs(row.wrongs)
        }));
      });
      let saved = '';
      try { saved = sessionStorage.getItem('DIGIMON_DUNGEON_ROOM_V1') || ''; } catch (err) {}
      if (saved) listenRoom(saved);
      else render();
      clockTimer = setInterval(() => {
        if (!currentRoom || currentRoom.status !== 'riddle' || !isHost(currentRoom) || !offsetReady) {
          if (currentRoom && currentRoom.status === 'riddle') render();
          return;
        }
        const question = currentRoom.question;
        if (!question || !question.by) return;
        const pending = Object.keys(question.by).some(id => {
          const member = currentRoom.members[id];
          return member && member.hp > 0 && !member.fainted && question.by[id] && !question.by[id].answered;
        });
        if (!pending) return;
        if (!question.endsAt) {
          commit({ type: 'armRiddle', now: syncedNow() });
          return;
        }
        if (syncedNow() >= question.endsAt) commit({ type: 'closeRiddle', memberId: gate.id });
        else render();
      }, 400);
    }

    window.DungeonApi = { createRoom, reduce, buildMember, scaleOf, threatOf, foeStats, ROOM_WEIGHTS, RUN_FLOORS, BUILTIN_QUESTIONS, DIGI_CATALOG, attributeDamageMultiplier, ENCOUNTER_BOOK, megaRoster };
    if (window.__DIGI_TEST_DB) {
      window.__digiDungeonTest = {
        reviveJoin(room) {
          leavingClass = false;
          sawLiveRun = false;
          if (meStudent) {
            meStudent.hp = meStudent.maxHp || 400;
            meStudent.isFainted = false;
            meStudent.dungeonTickets = 1;
          }
          onRoomSnapshot(room);
        }
      };
    }
    if (gate) boot();
  </script>
</body>
</html>
