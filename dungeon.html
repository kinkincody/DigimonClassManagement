        if (kind === 'revive') {
          if (!actor.bag || actor.bag.revive < 1) return null;
          actor.bag.revive -= 1;
        }
        reviveMember(ally);
        actor.acted = true;
        floats.push({ text: 'Revive', who: ally.id });

      } else {
        const skill = (actor.skills || [])[action.skill || 0] || { name: 'Strike', power: 10, type: 'damage' };
        actor.acted = true;
        if (skill.type === 'heal') {
          const gain = healMember(actor, skill.power);
          floats.push({ text: '+' + gain, who: actor.id });
        } else if (foe.kind === 'boss' && room.combat.phase === 1) {
          const bodies = room.combat.bodies || [];
          const body = bodies.find(item => item.id === action.targetId) || bodies[0];
          if (body && body.real) {
            const hit = strikeFoe(room, actor, foe, skill.power);
            floats.push({ text: hit.dealt ? ('-' + hit.dealt + (hit.tag ? ' ' + hit.tag : '')) : 'Immune', who: 'foe' });
          } else {
            floats.push({ text: 'Clone', who: 'foe' });
            const counter = typedHit(foe.type, actor.type, foe.atk);
            const dealt = damageMember(actor, counter.dealt);
            floats.push({ text: '-' + dealt + (counter.tag ? ' ' + counter.tag : ''), who: actor.id });
            pushFeed(room, 'The clone counters');
          }
        } else {
          const hit = strikeFoe(room, actor, foe, skill.power);
          floats.push({ text: hit.dealt ? ('-' + hit.dealt + (hit.tag ? ' ' + hit.tag : '')) : 'Immune', who: 'foe' });
        }
        enterPhaseTwo(room);
      }
      if (foe.hp <= 0) {
        commitFloats(room, floats);
        onCombatCleared(room);
        return room;
      }
      const ready = livingMembers(room).every(member => member.acted);

      if (!livingMembers(room).length) markDefeat(room);

      const hit = typedHit(actor.type, foe.type, raw);
      foe.hp = Math.max(0, foe.hp - hit.dealt);

        });
      }
      const sprite = '<div class="w-28 h-28 mx-auto rounded-3xl bg-rose-950 border border-rose-500 flex items-center justify-center text-4xl relative overflow-hidden"><i class="fa-solid ' + esc(foe.icon || 'fa-paw') + '"></i>' + (foe.img ? '<img src="' + esc(foe.img) + '" alt="' + esc(foe.name) + '" class="absolute inset-0 w-full h-full object-contain bg-slate-950" onerror="this.remove()">' : '') + '</div>';
      return '<section id="combatArena" class="relative space-y-3"><div class="rounded-3xl border border-rose-500/40 bg-slate-900 p-4 space-y-2">' + sprite + '<h2 class="text-center font-black">' + esc(foe.name) + '</h2><p class="text-center text-xs font-mono text-cyan-200">' + esc(foe.type || 'Free') + '</p>' + hpRow('Enemy', foe.hp, foe.maxHp, true) + resist + bodies + '</div><div class="grid grid-cols-1 sm:grid-cols-2 gap-2">' + skills + '</div><div class="flex flex-wrap gap-2">' + items.join('') + '</div>' + partyStrip(room) + '<div class="text-[11px] text-slate-400 space-y-1">' + (room.feed || []).slice(-4).map(line => '<p>' + esc(line) + '</p>').join('') + '</div></section>';
    }
    function renderRiddle(room) {
      const question = room.question;
      const ends = question.endsAt || 0;
      const left = ends ? Math.max(0, ends - syncedNow()) : 20000;
      const pct = Math.max(0, Math.min(100, Math.round(left / 20000 * 100)));
      const options = question.options.map(option => '<button data-act="choice" data-choice="' + esc(option) + '" class="tap rounded-2xl bg-slate-900 border border-cyan-700 text-left px-3 font-bold">' + esc(option) + '</button>').join('');
      const cast = question.cast || castOf('shrine');
      return '<section id="riddleBox" class="sheet-wrap fixed inset-0 z-30 bg-slate-950/80 flex items-end sm:items-center justify-center p-3"><div class="sheet rounded-3xl bg-slate-900 border border-cyan-400 p-4 space-y-3 overflow-y-auto">' + castCard(cast) + '<p class="text-xs font-black text-cyan-300">學術石碑 Knowledge Shrine</p><h2 class="text-lg font-black leading-snug">' + esc(question.text) + '</h2><div class="hp-bar"><div class="hp-fill" style="width:' + pct + '%"></div></div><div class="grid grid-cols-1 gap-2">' + options + '</div></div></section>';
    }
    function castCard(cast) {
      const who = cast || { name: 'Digimon', type: 'Free', img: '', icon: 'fa-paw' };
      return '<div class="w-28 h-28 mx-auto rounded-3xl bg-slate-950 border border-cyan-500/40 flex items-center justify-center relative overflow-hidden"><i class="fa-solid ' + esc(who.icon || 'fa-paw') + ' text-3xl text-cyan-200"></i><img src="' + esc(who.img) + '" alt="' + esc(who.name) + '" class="absolute inset-0 w-full h-full object-contain bg-slate-950" onerror="this.remove()"></div><p class="text-center font-black">' + esc(who.name) + ' <span class="text-xs font-mono text-cyan-300">' + esc(who.type || 'Free') + '</span></p>';
    }
    function renderEvent(room) {
      const event = room.event || {};
      const me = myMember(room);
      const who = castCard(event.cast);
      if (event.kind === 'oasis') {
        const controls = isHost(room)
          ? '<button id="btnOasisHeal" data-act="oasis-heal" class="tap rounded-2xl bg-emerald-600 font-black">回復 40% HP</button><button id="btnOasisFocus" data-act="oasis-focus" class="tap rounded-2xl bg-cyan-700 font-black">專注 2 回合 Focus</button>'
          : '<p class="text-sm text-slate-400">隊長正在綠洲做選擇。 / The host is choosing.</p>';
        return '<section class="rounded-3xl border border-emerald-500/40 bg-slate-900 p-4 space-y-3">' + who + '<h2 class="font-black text-emerald-300">🏕️ 數碼綠洲 Digital Oasis</h2><div class="grid grid-cols-1 gap-2">' + controls + '</div></section>';
      }
      if (event.kind === 'merchant') {
        const rows = SHOP.map(item => '<button data-act="buy" data-item="' + item.id + '" class="tap rounded-2xl bg-slate-950 border border-amber-600 text-left px-3"><span class="font-black">' + esc(item.name) + '</span><span class="block text-xs text-amber-200">' + item.price + ' coins · you have ' + coinsOf() + '</span></button>').join('');
        const bag = me && me.bag ? 'Smoke ' + me.bag.smoke + ' · Revive ' + me.bag.revive + ' · Shield ' + me.bag.shield + ' · Meat ' + me.bag.meat : '';
        const leave = isHost(room) ? '<button id="btnLeaveNode" data-act="leave-node" class="tap w-full rounded-2xl bg-slate-800 font-black">離開黑市 Leave</button>' : '<p class="text-sm text-slate-400">可以先購買。隊長離開時全隊前進。 / You can buy. The host leads the squad on.</p>';
        return '<section class="rounded-3xl border border-amber-500/40 bg-slate-900 p-4 space-y-3">' + who + '<h2 class="font-black text-amber-300">Digitamamon 的黑市</h2><p class="text-xs font-mono text-slate-300">' + bag + '</p><div class="grid grid-cols-1 gap-2">' + rows + '</div>' + leave + '</section>';
      }
      if (event.kind === 'baby') {
        return '<section class="rounded-3xl border border-pink-500/40 bg-slate-900 p-4 space-y-3">' + who + '<h2 class="font-black">受傷的幼年數碼獸</h2><p class="text-sm text-slate-300">餵肉可以讓牠一路協助戰鬥。忽略就離開。</p><div class="grid grid-cols-1 gap-2"><button id="btnFeedMeat" data-act="baby-feed" class="tap rounded-2xl bg-pink-700 font-black">用背包的肉餵食 Feed meat</button><button data-act="baby-buy" class="tap rounded-2xl bg-amber-700 font-black">花 8 金幣買肉並餵食</button><button id="btnIgnoreBaby" data-act="baby-ignore" class="tap rounded-2xl bg-slate-800 font-black">忽略 Ignore</button></div></section>';
      }
      if (event.kind === 'shortcut') {
        return '<section class="rounded-3xl border border-cyan-500/40 bg-slate-900 p-4 space-y-3">' + who + '<h2 class="font-black text-cyan-200">隱藏捷徑</h2><p class="text-sm text-slate-300">這條路沒有陷阱，並回復 10% HP。</p><button id="btnLeaveNode" data-act="leave-node" class="tap w-full rounded-2xl bg-cyan-700 font-black">跟著走 Follow</button></section>';
      }
      return '<section class="rounded-3xl border border-amber-400/40 bg-slate-900 p-4 space-y-3">' + who + '<h2 class="font-black">寶箱 Vault</h2><p class="text-sm">Salamon 交出光之碎片。Light +20。通關獎勵仍然是固定的 1000 EXP、1000 金幣、5 張扭蛋券。</p>' + (isHost(room) ? '<button id="btnVaultOk" data-act="leave-node" class="tap w-full rounded-2xl bg-amber-500 text-slate-950 font-black">收下 Continue</button>' : '<p class="text-sm text-slate-400">等待隊長。 / Waiting for the host.</p>') + '</section>';
    }
    function renderSettlement(room) {
      const result = room.result || {};
      if (result.kind === 'victory') {
        return '<section id="victoryModal" class="sheet-wrap fixed inset-0 z-40 bg-slate-950/80 flex items-end sm:items-center justify-center p-3"><div class="sheet rounded-3xl bg-slate-900 border border-amber-300 p-5 space-y-3"><h2 class="text-2xl font-black text-amber-200">第十層清除</h2><p class="text-sm text-slate-200">ChaosPiedmon 混沌小丑皇倒下了。每位參加者都獲得這份獎勵。</p><ul class="text-sm font-mono space-y-1"><li>EXP +' + result.exp + '</li><li>Coins +' + result.coins + '</li><li>Gacha tickets +' + result.tickets + '</li></ul><a href="index.html" class="tap flex items-center justify-center rounded-2xl bg-cyan-600 font-black">返回課堂 Return</a></div></section>';
      }
      return '<section id="defeatModal" class="sheet-wrap fixed inset-0 z-40 bg-slate-950/80 flex items-end sm:items-center justify-center p-3"><div class="sheet rounded-3xl bg-slate-900 border border-rose-400 p-5 space-y-3"><h2 class="text-2xl font-black text-rose-200">全員倒下</h2><p class="text-sm">到達 Floor ' + result.floor + '/10。' + esc(result.killer || 'Digital Matrix') + ' 讓全隊的數碼獸倒下。回到課堂後要用復活問答才能起來。</p><a href="index.html" class="tap flex items-center justify-center rounded-2xl bg-slate-700 font-black">離開 Exit</a></div></section>';
    }
    function render() {
      if (!gate) return;
      paintHeader();
      const app = document.getElementById('app');
      if (!meStudent) {
        app.innerHTML = '<p class="text-sm text-slate-400">正在讀取馴獸師資料… / Loading tamer record…</p>';
        return;
      }
      let html = '';
      const room = currentRoom;
      if (!room || !myMember(room)) html = renderLobby();
      else if (room.status === 'lobby') html = renderLobby();
      else if (room.status === 'map') html = renderMap(room);
      else if (room.status === 'combat') html = renderCombat(room);
      else if (room.status === 'riddle') html = renderRiddle(room) + renderMap(Object.assign({}, room, { nodes: [] }));
      else if (room.status === 'event') html = renderEvent(room);
      else html = partyStrip(room);
      if (room && (room.status === 'victory' || room.status === 'defeat')) html += renderSettlement(room);
      const typing = document.activeElement && document.activeElement.id === 'joinCode';
      const draft = typing ? document.activeElement.value : joinDraft;
      app.innerHTML = html;
      const input = document.getElementById('joinCode');
      if (input) {
        input.value = draft;
        joinDraft = draft;
        if (typing) input.focus();
      }
      spawnFloats(room);
      if (window.__DIGI_TEST_DB) window.currentRoom = currentRoom;
      if (room && room.status === 'victory' && !celebrated) {
        celebrated = true;
        if (typeof confetti === 'function') confetti({ particleCount: 180, spread: 110, origin: { y: 0.55 } });
      }
    }
    function spawnFloats(room) {
      if (!room || (room.floatSeq || 0) === seenFloat) return;
      seenFloat = room.floatSeq || 0;
      const layer = document.getElementById('floatLayer');
      (room.lastFloats || []).forEach((float, index) => {
        const chip = document.createElement('div');
        chip.className = 'float-dmg';
        chip.textContent = float.text;
        chip.style.left = (18 + (index % 4) * 18) + '%';
        chip.style.top = (28 + Math.floor(index / 4) * 8) + '%';
        layer.appendChild(chip);
        setTimeout(() => chip.remove(), 900);
      });
    }

    async function onAppClick(event) {
      const button = event.target.closest('[data-act]');
      if (!button || button.disabled) return;
      const act = button.dataset.act;
      if (act === 'solo') return startSolo();
      if (act === 'create') return createLobby();
      if (act === 'join') return joinByCode();
      if (act === 'start') return startSquad();
      if (act === 'leave') return leaveLobby();
      if (act === 'node') {
        pendingNode = button.dataset.id;
        render();
        return;
      }
      if (act === 'cancel') {
        pendingNode = '';
        render();
        return;
      }
      if (act === 'confirm') {
        const nodeId = pendingNode;
        pendingNode = '';
        await commit({ type: 'choose', nodeId: nodeId, memberId: gate.id, now: offsetReady ? syncedNow() : 0, bank: questionBank() });
        return;
      }
      if (act === 'choice') return commit({ type: 'answer', memberId: gate.id, choice: button.dataset.choice });
      if (act === 'oasis-heal') return commit({ type: 'oasis', memberId: gate.id, choice: 'heal' });
      if (act === 'oasis-focus') return commit({ type: 'oasis', memberId: gate.id, choice: 'focus' });
      if (act === 'leave-node') return commit({ type: 'leaveNode', memberId: gate.id });
      if (act === 'buy') return buyItem(button.dataset.item);
      if (act === 'baby-feed') return feedOrBuy(false);
      if (act === 'baby-buy') return feedOrBuy(true);
      if (act === 'baby-ignore') return commit({ type: 'baby', memberId: gate.id, feed: false });
      if (act === 'body') {
        selectedBody = button.dataset.body;
        render();
        return;
      }
      if (act === 'skill') {
        return commit({ type: 'act', memberId: gate.id, kind: 'skill', skill: Number(button.dataset.skill) || 0, targetId: selectedBody });
      }
      if (act === 'item-smoke') return commit({ type: 'act', memberId: gate.id, kind: 'smoke' });
      if (act === 'item-shield') return commit({ type: 'act', memberId: gate.id, kind: 'shield' });
      if (act === 'revive') return commit({ type: 'act', memberId: gate.id, kind: 'revive', allyId: button.dataset.ally });
      if (act === 'sacrifice') return commit({ type: 'act', memberId: gate.id, kind: 'sacrifice', allyId: button.dataset.ally });
    }

    function boot() {
      if (!gate) return;
      document.getElementById('app').addEventListener('click', onAppClick);
      document.getElementById('app').addEventListener('input', event => {
        if (event.target.id === 'joinCode') joinDraft = event.target.value;
      });
      db = window.__DIGI_TEST_DB || null;
      if (!db) {
        if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.database().ref();
      }
      db.child('.info/serverTimeOffset').on('value', snap => {
        if (!snap.exists()) return;
        offset = Number(snap.val()) || 0;
        offsetReady = true;
      });
      db.child('students/' + String(gate.id).toLowerCase()).on('value', snap => {
        meStudent = snap.val();
        if (meStudent) meStudent.id = String(gate.id).toLowerCase();
        render();
      });
      const classKey = sanitizeClassKey(firstClass(gate.classId));
      db.child('systemSettings/dungeonQuestions/' + classKey).on('value', snap => {
        const raw = snap.val();
        const rows = !raw ? [] : (Array.isArray(raw) ? raw : Object.keys(raw).sort().map(key => raw[key]));
        shrineBank = rows.filter(row => row && row.question && row.correct).map(row => ({
          question: String(row.question),
          correct: String(row.correct),
          wrongs: Array.isArray(row.wrongs) ? row.wrongs.map(String) : []
        }));
      });
      let saved = '';
      try { saved = sessionStorage.getItem('DIGIMON_DUNGEON_ROOM_V1') || ''; } catch (err) {}
      if (saved) listenRoom(saved);
      else render();
      clockTimer = setInterval(() => {
        if (!currentRoom || currentRoom.status !== 'riddle' || !isHost(currentRoom) || !offsetReady) {
          if (currentRoom && currentRoom.status === 'riddle') render();
          return;
        }
        const question = currentRoom.question;
        if (!question || question.answered) return;
        if (!question.endsAt) {
          commit({ type: 'armRiddle', now: syncedNow() });
          return;
        }
        if (syncedNow() >= question.endsAt) commit({ type: 'answer', memberId: gate.id, choice: '__timeout__' });
        else render();
      }, 400);
    }

    window.DungeonApi = { createRoom, reduce, buildMember, scaleOf, BUILTIN_QUESTIONS, DIGI_CATALOG, attributeDamageMultiplier, ENCOUNTER_BOOK };
    if (gate) boot();
  </script>
</body>
</html>
